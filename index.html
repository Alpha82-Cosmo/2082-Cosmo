<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <title>Sgt. Cosmo: Alpha82 Command HQ</title>
  <style>
    :root { --green: #39dc6d; --cyan: #00ADEF; --navy: #020B1A; }
    body { background: #000; color: white; margin: 0; font-family: 'Courier New', monospace; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .tv-frame { width: 95vw; height: 95vh; max-width: 800px; max-height: 600px; border: 15px solid #222; border-radius: 40px; position: relative; background: #050505; box-shadow: inset 0 0 80px #000, 0 0 40px rgba(57, 220, 109, 0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; animation: crt-flicker 0.1s infinite; }
    @keyframes crt-flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.97; } }
    #matrix-canvas { position: absolute; width: 100%; height: 100%; opacity: 0.5; z-index: 1; display:none; }
    
    #start-container { z-index: 30; border: 3px solid var(--green); box-shadow: 0 0 20px var(--green); padding: 20px; cursor: pointer; transition: transform 0.2s; background: rgba(0, 20, 0, 0.3); border-radius: 10px; display: flex; justify-content: center; align-items: center; }
    #start-container:hover { transform: scale(1.05); background: rgba(0, 40, 0, 0.5); }
    #init-logo { width: 250px; filter: drop-shadow(0 0 15px var(--cyan)); display: block; }
    
    #hud-content { position: relative; z-index: 10; display: none; flex-direction: column; align-items: center; width: 90%; }
    .logo { width: 250px; margin-bottom: 10px; filter: drop-shadow(0 0 15px var(--cyan)); transition: all 0.3s ease; }
    .terminal { background: rgba(0,0,0,0.9); padding: 15px; border: 1px solid var(--cyan); color: var(--cyan); margin-bottom: 15px; font-weight: bold; width: 100%; text-align: center; overflow: hidden; min-height: 25px; }
    
    .input-row { display: flex; width: 85%; gap: 10px; margin-bottom: 15px; }
    .bark-box { background: rgba(0,0,0,0.7); border: 2px solid var(--green); color: var(--green); padding: 12px; width: 100%; font-family: 'Courier New', monospace; outline: none; font-size: 16px; }
    .mic-btn, .stealth-btn { background: #222; border: 2px solid var(--cyan); color: white; padding: 0 15px; font-size: 1.5rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .mic-btn:hover, .stealth-btn:hover { background: var(--cyan); color: black; }
    
    /* New styling for active recording */
    .mic-active { background: red !important; border-color: darkred !important; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

    .sniff-btn { background: var(--green); border: none; padding: 15px 40px; font-weight: 900; cursor: pointer; color: var(--navy); text-transform: uppercase; letter-spacing: 2px; }
    .sniff-btn:hover { background: white; }

    .ticker-wrap { width: 100%; overflow: hidden; white-space: nowrap; box-sizing: border-box; }
    .ticker-text { display: inline-block; padding-left: 100%; }
    .ticker-text:hover, .ticker-text:active { animation-play-state: paused !important; color: #fff; cursor: pointer; }
    @keyframes scroll-ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    /* 🟢 CRISP COCKPIT OVERLAY POPUP MODAL SCREEN - ISOLATED LAYER */
    .hud-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 11, 26, 0.97); z-index: 50; border-radius: 25px; box-sizing: border-box; padding: 25px; flex-direction: column; overflow-y: auto; border: 3px solid var(--cyan); box-shadow: inset 0 0 30px rgba(0, 173, 239, 0.4); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--cyan); padding-bottom: 10px; margin-bottom: 15px; }
    .modal-title { color: var(--cyan); font-size: 20px; font-weight: 900; letter-spacing: 1px; }
    .close-btn { background: #ff3b30; border: none; color: white; padding: 5px 15px; cursor: pointer; font-family: monospace; font-weight: bold; border-radius: 4px; font-size: 16px; }
    .close-btn:hover { background: white; color: black; }
    .hud-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 16px; }
    .hud-table tr { border-bottom: 1px solid rgba(0, 173, 239, 0.2); }
    .hud-table td { padding: 10px 5px; }
    .hud-label { color: var(--cyan); font-weight: bold; width: 40%; text-transform: uppercase; }
    .hud-value { color: var(--green); font-weight: 900; text-align: left; }

    /* =========================================================================
   🛸 AR BUZZ CYBER-NEON TACTICAL HUD POPUP OVERLAY
   ========================================================================= */
#hud-overlay {
  display: none; 
  position: fixed;
  z-index: 9999; 
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(2, 11, 26, 0.85); /* Night Navy with heavy opacity */
  backdrop-filter: blur(6px) saturate(180%); /* Futuristic frosted glass */
  align-items: center;
  justify-content: center;
}

.hud-modal-card {
  background: #020B1A; /* Night Navy Base */
  border: 2px solid #39dc6d; /* Electric Green Neon Piping */
  box-shadow: 0 0 25px rgba(57, 220, 109, 0.25), inset 0 0 15px rgba(0, 173, 239, 0.1); /* Green glow outside, Cyan inside */
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
  padding: 20px;
  position: relative;
  animation: cyberSlideIn 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
}

.hud-close-btn {
  position: absolute;
  top: 12px;
  right: 15px;
  background: transparent;
  border: 1px solid #00ADEF; /* Vivid Cyan border */
  color: #72FAD2; /* Glass Highlight text */
  padding: 4px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.25s ease;
}

.hud-close-btn:hover {
  background: rgba(0, 173, 239, 0.2);
  color: #39dc6d; /* Electric Green on hover */
  border-color: #39dc6d;
  box-shadow: 0 0 12px rgba(57, 220, 109, 0.5);
}

@keyframes cyberSlideIn {
  from { opacity: 0; transform: translateY(-30px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
    
    </style>
</head>
<body>
  <div class="tv-frame">
    <canvas id="matrix-canvas"></canvas>
    
    <div id="start-container" onclick="runHackSequence()">
      <img id="init-logo" src="https://drive.google.com/thumbnail?id=1oVl0afowsVSkh_KV3hxVL01Xmf4YSsdd&sz=w500">
    </div>
    
    <div id="hud-content">
      <img id="cosmo-visual" src="https://drive.google.com/thumbnail?id=1ElI-BhVIDj_d-4SEFtKMP8-OgYS7JeVT&sz=w500" class="logo">
      <div class="terminal" id="output">SYSTEMS STANDBY</div>
      
      <div class="input-row">
        <input type="text" id="bark-input" class="bark-box" placeholder="TYPE OR SPEAK COMMAND...">
        <button id="mic-btn" class="mic-btn" onclick="toggleMic()" title="Voice Command">🎤</button>
        <button class="stealth-btn" id="stealth-btn" onclick="toggleStealth()" title="Stealth Mode">🔊</button>
      </div> 

      <div id="husky-hud-alert" class="terminal" style="display: none; border-color: var(--green); color: var(--green); margin-top: 15px;">
        🦮 HUD COCKPIT UPDATED! OPENING PROFILE DIRECTLY...
      </div>
      
      <button class="sniff-btn" onclick="fetchAI()">ENGAGE BRAIN</button>
    </div>
  </div>
  <!-- 🟢 DYNAMIC LIVE COCKPIT POPUP OVERLAY -->
    <div id="husky-hud-modal" class="hud-modal">
      <div class="modal-header">
        <span id="hud-modal-title" class="modal-title">📊 KENNEL TARGET LOOKUP</span>
        <button class="close-btn" onclick="closeHudModal()">[X]</button>
      </div>
      <table class="hud-table" id="hud-modal-table">
        <!-- Script injects data profiles vertically right here -->
      </table>
    </div>
  <script>
    // --- YOUR KEYS & URLS ---
    const COSMO_API_URL = "https://script.google.com/macros/s/AKfycbxBWLqXeo8MXRFMo29aj90_XCIJRD8PA-oiSxCaYGeh3h2IVkSSyC1xJa39atZan_O_/exec";
   
    const synth = window.speechSynthesis;
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    const visual = document.getElementById('cosmo-visual');
    let stealthMode = false;
    let isRecording = false;
    let deepgramSocket;
    let tempDeepgramToken = ""; 
    let mediaRecorder;
    function closeHudModal() {
      document.getElementById('husky-hud-modal').style.display = 'none';
    }

    function toggleStealth() {
      stealthMode = !stealthMode;
      document.getElementById('stealth-btn').innerText = stealthMode ? "🔇" : "🔊";
      if (stealthMode) window.speechSynthesis.cancel();
    }

    async function toggleMic() {
      const micBtn = document.getElementById('mic-btn');
      const inputBox = document.getElementById('bark-input');
      const outputTicker = document.getElementById('output');

      if (!isRecording) {
        isRecording = true;
        micBtn.classList.add('mic-active');
        micBtn.innerText = "🛑";
        inputBox.value = "";
        
        outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 5s linear infinite;">>>> 🔒 SECURING BURNER PASS...</div></div>';

        try {
          const tokenRes = await fetch(COSMO_API_URL + "?request=deepgram_token&pawshake=AR_BUZZ_ALPHA_82_LOCKED");
          const tokenData = await tokenRes.json();
          if (!tokenData.success) throw new Error("Vault access denied: " + tokenData.error);
          tempDeepgramToken = tokenData.token;

          outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 5s linear infinite;">>>> 🔴 EARS OPEN. STREAMING... SPEAK NOW.</div></div>';

          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          
          deepgramSocket = new WebSocket("wss://api.deepgram.com/v1/listen?smart_format=true&diarize=true", ["token", tempDeepgramToken]);

          deepgramSocket.onopen = () => {
            mediaRecorder.addEventListener('dataavailable', event => {
              if (event.data.size > 0 && deepgramSocket.readyState === 1) {
                deepgramSocket.send(event.data);
              }
            });
            mediaRecorder.start(250); 
          };

          deepgramSocket.onmessage = (message) => {
            const received = JSON.parse(message.data);
            if (received.channel && received.channel.alternatives[0]) {
              const transcript = received.channel.alternatives[0].transcript;
              if (transcript && received.is_final) {
                inputBox.value += transcript + " "; 
              }
            }
          };

          deepgramSocket.onerror = (err) => {
            console.error("Stream error:", err);
          };

          deepgramSocket.onclose = (event) => {
            if (isRecording && inputBox.value.trim() === "") {
               outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 5s linear infinite;">>>> 📡 STREAM DISCONNECTED. CODE: ' + event.code + '</div></div>';
            }
          };

        } catch (err) {
          isRecording = false;
          micBtn.classList.remove('mic-active');
          micBtn.innerText = "🎤";
          outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 5s linear infinite;">>>> ERROR: ' + err.message.toUpperCase() + '</div></div>';
        }

      } else {
        isRecording = false;
        micBtn.classList.remove('mic-active');
        micBtn.innerText = "🎤";
        
        outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 5s linear infinite;">>>> 📡 RELAYING COMMAND DATA TO RADIO TOWER... STANDBY.</div></div>';

        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
          mediaRecorder.stream.getTracks().forEach(track => track.stop());
        }
        if (deepgramSocket) deepgramSocket.close();

        setTimeout(() => {
          const finalCommand = inputBox.value.trim();
          if (finalCommand !== "") {
            fetchAI();
          } else {
            inputBox.placeholder = "TYPE OR SPEAK COMMAND...";
            outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 5s linear infinite;">>>> SYSTEM IDLE. STANDING AT HEEL.</div></div>';
          }
        }, 500);
      }
    }

    function runHackSequence() {
      document.getElementById('start-container').style.display = 'none';
      document.getElementById('hud-content').style.display = 'flex';
      document.getElementById('matrix-canvas').style.display = 'block';
      if (typeof initMatrix === 'function') initMatrix();
    }

   async function fetchAI() {
      const inputBox = document.getElementById('bark-input');
      const outputTicker = document.getElementById('output');
      const textCommand = inputBox.value.trim();
      if (!textCommand) return;
      inputBox.value = "";
      outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 5s linear infinite;">>>>> 📡 TRANSMITTING TO RADIO TOWER...</div></div>';
      try {
        const response = await fetch(COSMO_API_URL, {
          method: 'POST',
          body: JSON.stringify({
            pawshake: "AR_BUZZ_ALPHA_82_LOCKED",
            query: textCommand
          })
        });
        
        const data = await response.json();
        const cosmoReply = data.reply;

        // 🟢 DUAL HUD INTERCEPTOR: CRM LOOKUPS & ACTIVE TASK LISTS
        const replyUpper = cosmoReply.toUpperCase();

        if (replyUpper.includes("CRM HUD SECURED")) {
          // Track 1: Handle your CRM Profile Lookups (Completely untouched!)
          const parts = cosmoReply.split(" | ");
          const titleMatch = parts[0].match(/\[(.*?)\]/);
          const targetID = titleMatch ? titleMatch[1] : "UNKNOWN ID";
          
          document.getElementById('hud-modal-title').innerText = "📊 KENNEL PROFILE: " + targetID;
          
          let tableContent = "";
          for (let i = 1; i < parts.length; i++) {
            const segment = parts[i].replace(" 🦮⚡", "");
            const splitIdx = segment.indexOf(":");
            if (splitIdx !== -1) {
              const label = segment.substring(0, splitIdx).trim();
              const value = segment.substring(splitIdx + 1).trim();
              tableContent += `<tr><td class="hud-label">${label}</td><td class="hud-value">${value}</td></tr>`;
            }
          }
          
          document.getElementById('hud-modal-table').innerHTML = tableContent;
          document.getElementById('husky-hud-modal').style.display = 'flex';
        } 
        else if (replyUpper.includes("ACTIVE TASKS")) {
          // Track 2: Handle your task board fetches beautifully
          document.getElementById('hud-modal-title').innerText = "📊 TACTICAL BRIEFING: ACTIVE TASKS";
          document.getElementById('hud-modal-table').innerHTML = `<tr><td colspan="2" style="padding: 10px 0 0 0; background: #020B1A;">${cosmoReply}</td></tr>`;
          document.getElementById('husky-hud-modal').style.display = 'flex';
        }
      }
       
     outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 8s linear infinite;">>>>> ' + cosmoReply.toUpperCase() + '</div></div>';
        if (!stealthMode) {
          if (!tempDeepgramToken) {
            const tokenRes = await fetch(COSMO_API_URL + "?request=deepgram_token&pawshake=AR_BUZZ_ALPHA_82_LOCKED");
            const tokenData = await tokenRes.json();
            if (tokenData.success) tempDeepgramToken = tokenData.token;
          }
          if (tempDeepgramToken) {
            const audioRes = await fetch("https://api.deepgram.com/v1/speak?model=aura-helios-en", {
              method: "POST",
              headers: {
                "Authorization": "Token " + tempDeepgramToken,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({ text: cosmoReply })
            });
            if (!audioRes.ok) {
               outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 8s linear infinite;">>>>> ' + cosmoReply.toUpperCase() + ' [DEEPGRAM VOICE ERROR: ' + audioRes.status + ']</div></div>';
            } else {
               const audioBlob = await audioRes.blob();
               const audioUrl = URL.createObjectURL(audioBlob);
               const audio = new Audio(audioUrl);
               audio.play().catch(e => {
                  outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 8s linear infinite;">>>>> ' + cosmoReply.toUpperCase() + ' [BROWSER BLOCKED AUDIO PLAYBACK]</div></div>';
               });
            }
          }
        }
      } catch (err) {
        outputTicker.innerHTML = '<div class="ticker-wrap"><div class="ticker-text" style="animation: scroll-ticker 5s linear infinite;">>>>> SIGNAL LOST. RADAR MALFUNCTION.</div></div>';
      }
    }
  </script>
</body>
</html>
